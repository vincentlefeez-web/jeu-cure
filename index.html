<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cure Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: joyeux, jeu mobile, encourageant
   IDEA: la carte de niveaux d'un jeu de plateau, un niveau = un jour de cure
   PICTURE: sentier sinueux de niveaux, étoiles sur les jours validés, le niveau du jour qui pulse
   COLOUR and TYPE: jaune soleil, encre prune, corail en accent, menthe pour les réussites; Fredoka + Nunito
   LAYOUT: barre de joueur, carte, gros bouton d'action, badges et réglages dessous */
:root{color-scheme:light dark;--bg:light-dark(#ffd23f,#1d1430);--card:light-dark(#fff8dc,#2b2045);--ink:light-dark(#2b1a3d,#fff4d6);--soft:light-dark(#6b5a7a,#c9bde0);--coral:#ff5a5f;--mint:#2fbf9b;--path:light-dark(#2b1a3d33,#fff4d633);--lock:light-dark(#e9dfb8,#3a2f55)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,.f{font-family:Fredoka,Nunito,sans-serif}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:22px;margin:0 0 12px}
.wrap{max-width:760px;margin:0 auto;padding:20px max(4vw,14px) 48px}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--soft);margin:4px 0 0}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 #0002}
.stat b{font-family:Fredoka;font-size:26px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--soft)}
.xp{height:10px;background:var(--lock);border-radius:9px;overflow:hidden;margin-top:6px}
.xp i{display:block;height:100%;background:var(--coral);transition:width .5s}
.board{background:var(--card);border-radius:26px;box-shadow:0 6px 0 #0002;overflow:hidden}
.map{position:relative;height:420px;overflow-y:auto;scroll-behavior:smooth}
.map svg{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;font:600 20px Fredoka;background:var(--lock);color:var(--soft);border:4px solid transparent}
.node.done{background:var(--mint);color:#fff;box-shadow:0 4px 0 #1b8a6f}
.node.now{background:var(--coral);color:#fff;box-shadow:0 4px 0 #c23a3f;animation:pulse 1.4s infinite}
.node.boss{width:72px;height:72px;margin:-36px 0 0 -36px;font-size:15px}
.node small{position:absolute;bottom:-20px;font:700 11px Nunito;color:var(--soft);white-space:nowrap}
@keyframes pulse{50%{transform:scale(1.1)}}
.action{padding:18px;border-top:2px dashed var(--path);display:grid;gap:10px;text-align:center}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--lock)}
.dots i.on{background:var(--mint)}
button{font:600 18px Fredoka;border:0;border-radius:16px;min-height:48px;padding:10px 18px;cursor:pointer;color:var(--ink);background:var(--lock)}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.big{background:var(--coral);color:#fff;font-size:22px;min-height:62px;box-shadow:0 5px 0 #c23a3f}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c23a3f}
.big:disabled{background:var(--lock);color:var(--soft);box-shadow:none;cursor:default}
.msg{font-weight:700;min-height:1.5em;margin:0}
.banner{display:none;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;margin-bottom:14px;font-weight:700;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner.show{display:flex}
.banner button{background:var(--coral);color:#fff;font-size:16px;min-height:44px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 0 #0002}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{border-radius:14px;padding:8px;text-align:center;font-size:13px;background:var(--lock);color:var(--soft)}
.badge svg{width:34px;height:34px;display:block;margin:0 auto 2px}
.badge.on{background:light-dark(#fff,#3a2f55);color:var(--ink);box-shadow:inset 0 0 0 2px var(--mint)}
label{display:block;font-size:14px;font-weight:700;margin:8px 0 4px}
input{width:100%;font:16px Nunito;padding:10px 12px;border-radius:12px;border:2px solid var(--path);background:light-dark(#fff,#1d1430);color:var(--ink);min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1;font-size:15px}
.note{font-size:13px;color:var(--soft);margin:10px 0 0}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:9}
.modal.show{display:grid}
.modal .panel{max-width:380px;text-align:center}
.modal h2{font-size:30px}
.burst{width:120px;height:120px;margin:0 auto}
@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}.stat b{font-size:22px}.map{height:360px}}
@media(prefers-reduced-motion:reduce){.node.now{animation:none}.map{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Cure Quest</h1><p class="sub" id="subtitle"></p></div>
  </div>

  <div class="banner" id="banner"><span id="bannerTxt"></span><button id="bannerBtn">C'est fait</button></div>

  <div class="hud">
    <div class="stat"><b id="lvl">1</b><span>niveau</span></div>
    <div class="stat"><b id="streak">0</b><span>jours d'affilée</span></div>
    <div class="stat"><b id="xpTxt">0</b><span id="rank">Apprenti</span><div class="xp"><i id="xpBar"></i></div></div>
  </div>

  <div class="board">
    <div class="map" id="map"><svg id="path"></svg></div>
    <div class="action">
      <div class="dots" id="dots"></div>
      <button class="big" id="take">J'ai pris ma dose</button>
      <p class="msg" id="msg"></p>
    </div>
  </div>

  <div class="grid">
    <div class="panel"><h2>Trophées</h2><div class="badges" id="badges"></div></div>
    <div class="panel">
      <h2>Ma cure</h2>
      <label for="pName">Produit</label><input id="pName">
      <label for="pDays">Durée (jours)</label><input id="pDays" type="number" min="3" max="120">
      <label for="pTimes">Heures des prises</label><input id="pTimes" placeholder="08:00, 20:00">
      <div class="row"><button id="save">Enregistrer</button><button id="reset">Recommencer</button></div>
      <div class="row"><button id="skip">Mode démo : jour suivant</button></div>
      <p class="note">Prototype : les rappels s'affichent ici quand l'appli est ouverte. Les vraies notifications sur le téléphone viendront avec la version installable.</p>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="panel">
  <svg class="burst" viewBox="0 0 120 120" aria-hidden="true"><g fill="#ff5a5f">
    <polygon points="60,8 72,44 110,44 79,66 90,104 60,81 30,104 41,66 10,44 48,44"/></g>
    <polygon points="60,30 66,50 86,50 70,61 76,82 60,70 44,82 50,61 34,50 54,50" fill="#ffd23f"/></svg>
  <h2 id="mTitle"></h2><p id="mTxt"></p>
  <div class="row" id="mRow"></div>
</div></div>

<script>
{
const KEY='cureQuest1';
const RANKS=[[0,'Apprenti'],[100,'Explorateur'],[250,'Guerrier'],[450,'Champion'],[700,'Légende']];
const BADGES=[
  {id:'first',t:'Premier pas',c:s=>s.done>=1,p:'M17 4l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z'},
  {id:'w3',t:'3 jours de suite',c:s=>s.best>=3,p:'M17 4c4 6 8 9 8 15a8 8 0 0 1-16 0c0-4 3-6 4-9 1 3 2 4 4 5 0-4-1-7 0-11z'},
  {id:'w7',t:'Semaine parfaite',c:s=>s.best>=7,p:'M8 6h18v6a9 9 0 0 1-18 0zM13 22h8v4h4v3H9v-3h4z'},
  {id:'half',t:'Mi-parcours',c:s=>s.done>=Math.ceil(s.days/2),p:'M17 3a14 14 0 1 0 0 28 14 14 0 0 0 0-28zm0 3v22a11 11 0 0 1 0-22z'},
  {id:'boss',t:'Cure terminée',c:s=>s.done>=s.days,p:'M5 26l3-15 6 6 3-11 3 11 6-6 3 15z'},
  {id:'xp',t:'500 XP',c:s=>s.xp>=500,p:'M19 3L7 19h9l-2 12 12-16h-9z'}
];
const def=()=>({name:'Ma cure vitalité',days:21,times:['08:00'],done:0,taken:0,xp:0,streak:0,best:0,lock:'',lastRemind:''});
let s;
try{s=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){s=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toDateString();
const perDay=()=>Math.max(1,s.times.length);
const locked=()=>s.lock===today()&&s.done<s.days;
const rank=()=>RANKS.filter(r=>s.xp>=r[0]).pop();

function drawMap(){
  const m=$('map'),W=m.clientWidth,gap=92,top=60;
  const pts=[];
  for(let i=0;i<s.days;i++)pts.push([W/2+Math.sin(i*0.85)*Math.min(W*0.3,170),top+i*gap]);
  const H=top*2+(s.days-1)*gap;
  const svg=$('path');svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.height=H+'px';
  let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1]).join(' ');
  svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--path)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 22"/>`;
  m.querySelectorAll('.node').forEach(n=>n.remove());
  m.insertAdjacentHTML('beforeend',pts.map((p,i)=>{
    const st=i<s.done?'done':(i===s.done?'now':'');
    const boss=i===s.days-1;
    const lab=i<s.done?'★':(boss?'FINAL':i+1);
    const sm=boss?'<small>Cure complète</small>':(i===s.done?'<small>Aujourd\'hui</small>':'');
    return `<div class="node ${st} ${boss?'boss':''}" style="left:${p[0]}px;top:${p[1]}px">${lab}${sm}</div>`;
  }).join(''));
  const cur=pts[Math.min(s.done,s.days-1)];
  m.scrollTop=Math.max(0,cur[1]-m.clientHeight/2);
}
const ro=new ResizeObserver(drawMap);ro.observe($('map'));

function render(){
  $('title').textContent=s.name;
  $('subtitle').textContent=`${s.days} niveaux · ${perDay()} prise${perDay()>1?'s':''} par jour à ${s.times.join(', ')}`;
  $('lvl').textContent=Math.min(s.done+1,s.days)+'/'+s.days;
  $('streak').textContent=s.streak;
  const r=rank(),nx=RANKS.find(x=>x[0]>s.xp);
  $('xpTxt').textContent=s.xp+' XP';$('rank').textContent=r[1];
  $('xpBar').style.width=(nx?((s.xp-r[0])/(nx[0]-r[0]))*100:100)+'%';
  $('dots').innerHTML=Array.from({length:perDay()},(_,i)=>`<i class="${i<s.taken?'on':''}"></i>`).join('');
  const b=$('take'),msg=$('msg');
  if(s.done>=s.days){b.disabled=true;b.textContent='Cure terminée !';msg.textContent='Tu as battu le boss final.'}
  else if(locked()){b.disabled=true;b.textContent='Niveau validé ✓';msg.textContent='Reviens demain pour le niveau '+(s.done+1)+'.'}
  else{b.disabled=false;b.textContent=perDay()>1?`J'ai pris ma dose (${s.taken+1}/${perDay()})`:"J'ai pris ma dose";
    const left=s.days-s.done;
    msg.textContent=left<=5?`Plus que ${left} niveau${left>1?'x':''} : pense à recommander ta prochaine cure.`:'Valide ta prise pour passer le niveau.'}
  const st={done:s.done,best:s.best,days:s.days,xp:s.xp};
  $('badges').innerHTML=BADGES.map(x=>`<div class="badge ${x.c(st)?'on':''}"><svg viewBox="0 0 34 34"><path d="${x.p}" fill="${x.c(st)?'#ff5a5f':'currentColor'}"/></svg>${x.t}</div>`).join('');
  $('pName').value=s.name;$('pDays').value=s.days;$('pTimes').value=s.times.join(', ');
  drawMap();checkRemind();
}

function modal(title,txt,btns){
  $('mTitle').textContent=title;$('mTxt').textContent=txt;
  $('mRow').innerHTML=btns.map((b,i)=>`<button data-i="${i}" class="${i===0?'big':''}">${esc(b[0])}</button>`).join('');
  $('mRow').querySelectorAll('button').forEach(el=>el.onclick=()=>{$('modal').classList.remove('show');btns[+el.dataset.i][1]&&btns[+el.dataset.i][1]()});
  $('modal').classList.add('show');
}

function take(){
  if(locked()||s.done>=s.days)return;
  s.taken++;s.xp+=10;
  if(s.taken>=perDay()){
    s.taken=0;s.done++;s.streak++;s.best=Math.max(s.best,s.streak);
    const bonus=s.streak%7===0?50:20;s.xp+=bonus;s.lock=today();
    save();render();
    if(s.done>=s.days){
      modal('Boss vaincu !',`Tu as terminé tes ${s.days} jours de ${s.name}. Prêt pour la saison 2 ?`,[
        ['Commander ma prochaine cure',()=>modal('Bientôt ici','Ce bouton ouvrira ta page de commande ou ton lien distributeur.',[['OK']])],
        ['Plus tard']]);
    }else{
      const left=s.days-s.done;
      modal('Niveau '+s.done+' validé !',`+${bonus+10} XP. ${left<=5?'Plus que '+left+' niveaux avant la fin : pense à prévoir la suite.':'Rendez-vous demain pour le niveau '+(s.done+1)+'.'}`,[['Continuer']]);
    }
  }else{save();render();$('msg').textContent='Dose enregistrée, encore '+(perDay()-s.taken)+' aujourd\'hui.'}
}

function checkRemind(){
  const now=new Date(),hm=now.toTimeString().slice(0,5);
  const due=s.times.slice(0,s.taken+1).filter(t=>t<=hm).length>s.taken;
  const show=due&&!locked()&&s.done<s.days;
  $('banner').classList.toggle('show',show);
  if(show)$('bannerTxt').textContent=`C'est l'heure de ta prise (${s.times[s.taken]}) : le niveau ${s.done+1} t'attend !`;
}
setInterval(checkRemind,30000);

$('take').onclick=take;
$('bannerBtn').onclick=take;
$('save').onclick=()=>{
  s.name=$('pName').value.trim()||'Ma cure';
  s.days=Math.min(120,Math.max(3,parseInt($('pDays').value)||21));
  const t=$('pTimes').value.split(',').map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,'0')).sort();
  s.times=t.length?t.slice(0,4):['08:00'];
  s.taken=Math.min(s.taken,s.times.length-1);s.done=Math.min(s.done,s.days);
  save();render();$('msg').textContent='Cure enregistrée.';
};
$('reset').onclick=()=>modal('Recommencer ?','Ta progression, tes XP et tes trophées repartent de zéro.',[['Oui, recommencer',()=>{const k={name:s.name,days:s.days,times:s.times};s=Object.assign(def(),k);save();render()}],['Annuler']]);
$('skip').onclick=()=>{
  if(s.lock===today())s.lock='';
  else if(s.taken<perDay()&&s.done<s.days){s.streak=0;s.taken=0;$('msg').textContent='Jour manqué : ta série repart à zéro.'}
  save();render();
};
render();
}
</script>
</body>
</html>
